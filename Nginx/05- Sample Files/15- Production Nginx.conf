# ============================================================================
# Production nginx.conf
# ============================================================================
#
# Description:
#   A production-ready Nginx configuration demonstrating recommended
#   global settings, performance tuning, logging, compression,
#   security, and modular configuration.
#
# Suitable For:
#   - Django
#   - FastAPI
#   - Flask
#   - Node.js
#   - Microservices
#
# ============================================================================

# ----------------------------------------------------------------------------
# User & Worker Processes
# ----------------------------------------------------------------------------

user nginx;

worker_processes auto;

pid /run/nginx.pid;

# ----------------------------------------------------------------------------
# Error Logging
# ----------------------------------------------------------------------------

error_log /var/log/nginx/error.log warn;

# ----------------------------------------------------------------------------
# Load Dynamic Modules
# ----------------------------------------------------------------------------

include /usr/share/nginx/modules/*.conf;

# ----------------------------------------------------------------------------
# Events
# ----------------------------------------------------------------------------

events {

    worker_connections 4096;

    multi_accept on;

}

# ----------------------------------------------------------------------------
# HTTP Configuration
# ----------------------------------------------------------------------------

http {

    # ------------------------------------------------------------------------
    # MIME Types
    # ------------------------------------------------------------------------

    include       mime.types;

    default_type  application/octet-stream;

    # ------------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------------

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        '"$request_time"';

    access_log /var/log/nginx/access.log main;

    # ------------------------------------------------------------------------
    # Performance
    # ------------------------------------------------------------------------

    sendfile on;

    tcp_nopush on;

    tcp_nodelay on;

    keepalive_timeout 65;

    keepalive_requests 1000;

    server_tokens off;

    client_max_body_size 20M;

    # ------------------------------------------------------------------------
    # Gzip Compression
    # ------------------------------------------------------------------------

    gzip on;

    gzip_comp_level 6;

    gzip_min_length 1024;

    gzip_vary on;

    gzip_proxied any;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ------------------------------------------------------------------------
    # Proxy Cache
    # ------------------------------------------------------------------------

    proxy_cache_path
        /var/cache/nginx
        levels=1:2
        keys_zone=cache_zone:100m
        max_size=2g
        inactive=60m;

    # ------------------------------------------------------------------------
    # Rate Limiting
    # ------------------------------------------------------------------------

    limit_req_zone
        $binary_remote_addr
        zone=api_limit:10m
        rate=20r/s;

    limit_conn_zone
        $binary_remote_addr
        zone=conn_limit:10m;

    # ------------------------------------------------------------------------
    # Security Headers
    # ------------------------------------------------------------------------

    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header X-Content-Type-Options "nosniff" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------------
    # Include Virtual Hosts
    # ------------------------------------------------------------------------

    include /etc/nginx/conf.d/*.conf;

    include /etc/nginx/sites-enabled/*;

}

# ============================================================================
# Notes
# ============================================================================
#
# This file demonstrates:
#
# ✓ Event-driven architecture
# ✓ Worker tuning
# ✓ Logging
# ✓ Gzip compression
# ✓ Performance optimization
# ✓ Security hardening
# ✓ Proxy cache
# ✓ Rate limiting
# ✓ Modular configuration
#
# Individual server configurations should be placed in:
#
#   /etc/nginx/conf.d/
#
# or
#
#   /etc/nginx/sites-enabled/
#
# ============================================================================