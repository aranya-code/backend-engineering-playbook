# ============================================================================
# Basic Nginx Web Server Configuration
# ============================================================================
#
# Description:
#   A minimal Nginx configuration for serving a static website.
#
# Use Cases:
#   - Static HTML websites
#   - Landing pages
#   - Documentation sites
#   - Simple web applications
#
# ============================================================================

server {

    # Listen on HTTP port
    listen 80;

    # Domain name
    server_name example.com www.example.com;

    # Root directory containing website files
    root /var/www/html;

    # Default page
    index index.html index.htm;

    # ------------------------------------------------------------------------
    # Main Website
    # ------------------------------------------------------------------------

    location / {

        # Try requested file
        # If not found, return 404
        try_files $uri $uri/ =404;

    }

    # ------------------------------------------------------------------------
    # Error Pages
    # ------------------------------------------------------------------------

    error_page 404 /404.html;

    location = /404.html {

        internal;

    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {

        internal;

    }

    # ------------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------------

    access_log /var/log/nginx/access.log;

    error_log /var/log/nginx/error.log;

}