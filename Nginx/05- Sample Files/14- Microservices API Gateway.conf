# ============================================================================
# Microservices API Gateway
# ============================================================================
#
# Description:
#   API Gateway configuration for multiple backend microservices.
#
# Architecture:
#
#                   Nginx
#          ┌────────┼─────────┐
#          ▼        ▼         ▼
#      User API  Order API Payment API
#
# ============================================================================

upstream user_service {

    server user-api:8001;

}

upstream order_service {

    server order-api:8002;

}

upstream payment_service {

    server payment-api:8003;

}

server {

    listen 80;

    server_name api.example.com;

    # ------------------------------------------------------------------------
    # User Service
    # ------------------------------------------------------------------------

    location /api/users/ {

        proxy_pass http://user_service;

        include proxy_params;

    }

    # ------------------------------------------------------------------------
    # Order Service
    # ------------------------------------------------------------------------

    location /api/orders/ {

        proxy_pass http://order_service;

        include proxy_params;

    }

    # ------------------------------------------------------------------------
    # Payment Service
    # ------------------------------------------------------------------------

    location /api/payments/ {

        proxy_pass http://payment_service;

        include proxy_params;

    }

    # ------------------------------------------------------------------------
    # Health Check
    # ------------------------------------------------------------------------

    location /health {

        return 200 "API Gateway Healthy\n";

        add_header Content-Type text/plain;

    }

    # ------------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------------

    access_log /var/log/nginx/gateway-access.log;

    error_log /var/log/nginx/gateway-error.log;

}