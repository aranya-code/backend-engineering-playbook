# ============================================================================
# Gzip Compression Configuration
# ============================================================================
#
# Description:
#   Compresses HTTP responses before sending them to clients.
#
# Benefits:
#   - Reduced bandwidth usage
#   - Faster page loads
#   - Improved application performance
#   - Better user experience
#
# Recommended For:
#   - HTML
#   - CSS
#   - JavaScript
#   - JSON
#   - XML
#
# ============================================================================

server {

    listen 80;

    server_name example.com;

    root /var/www/html;

    index index.html;

    # ------------------------------------------------------------------------
    # Gzip Compression
    # ------------------------------------------------------------------------

    gzip on;

    gzip_comp_level 6;

    gzip_min_length 1024;

    gzip_vary on;

    gzip_proxied any;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ------------------------------------------------------------------------
    # Website
    # ------------------------------------------------------------------------

    location / {

        try_files $uri $uri/ =404;

    }

    # ------------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------------

    access_log /var/log/nginx/access.log;

    error_log /var/log/nginx/error.log;

}