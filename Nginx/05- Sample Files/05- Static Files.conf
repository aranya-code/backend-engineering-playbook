# ============================================================================
# Static Files Configuration
# ============================================================================
#
# Description:
#   Optimized configuration for serving static assets directly from Nginx.
#
# Serves:
#   - CSS
#   - JavaScript
#   - Images
#   - Fonts
#   - Videos
#   - Downloads
#
# Benefits:
#   - Faster response times
#   - Reduced backend load
#   - Browser caching
#   - Lower bandwidth usage
#
# ============================================================================

server {

    # HTTP Port
    listen 80;

    # Domain
    server_name example.com;

    # Website Root
    root /var/www/html;

    index index.html;

    # ------------------------------------------------------------------------
    # Main Website
    # ------------------------------------------------------------------------

    location / {

        try_files $uri $uri/ =404;

    }

    # ------------------------------------------------------------------------
    # CSS Files
    # ------------------------------------------------------------------------

    location ~* \.css$ {

        expires 30d;

        add_header Cache-Control "public";

        access_log off;

    }

    # ------------------------------------------------------------------------
    # JavaScript Files
    # ------------------------------------------------------------------------

    location ~* \.js$ {

        expires 30d;

        add_header Cache-Control "public";

        access_log off;

    }

    # ------------------------------------------------------------------------
    # Images
    # ------------------------------------------------------------------------

    location ~* \.(jpg|jpeg|png|gif|svg|ico|webp)$ {

        expires 30d;

        add_header Cache-Control "public";

        access_log off;

    }

    # ------------------------------------------------------------------------
    # Fonts
    # ------------------------------------------------------------------------

    location ~* \.(woff|woff2|ttf|otf|eot)$ {

        expires 30d;

        add_header Cache-Control "public";

        access_log off;

    }

    # ------------------------------------------------------------------------
    # Videos
    # ------------------------------------------------------------------------

    location ~* \.(mp4|webm|ogg)$ {

        expires 30d;

        add_header Cache-Control "public";

        access_log off;

    }

    # ------------------------------------------------------------------------
    # Downloadable Files
    # ------------------------------------------------------------------------

    location ~* \.(zip|pdf|doc|docx|xls|xlsx)$ {

        expires 7d;

        add_header Cache-Control "public";

    }

    # ------------------------------------------------------------------------
    # Deny Access to Hidden Files
    # ------------------------------------------------------------------------

    location ~ /\. {

        deny all;

    }

    # ------------------------------------------------------------------------
    # Error Pages
    # ------------------------------------------------------------------------

    error_page 404 /404.html;

    location = /404.html {

        internal;

    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {

        internal;

    }

    # ------------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------------

    access_log /var/log/nginx/access.log;

    error_log /var/log/nginx/error.log;

}