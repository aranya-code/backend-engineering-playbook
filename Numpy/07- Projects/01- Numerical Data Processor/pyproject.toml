        normalize_output=args.normalize,
        max_elements=args.max_elements,
        batch_size=args.batch_size,
    )

    try:
        result = run_pipeline(
            args.input,
            args.output,
            config=config,
        )
    except (FileNotFoundError, FileExistsError, TypeError, ValueError) as exc:
        print(
            f"Pipeline failed: {exc}",
            file=sys.stderr,
        )
        return 1

    print(f"Output: {result.output_path}")
    print(f"Input elements: {result.input_elements:,}")
    print(f"Output elements: {result.output_elements:,}")
    print(f"Input bytes: {result.input_nbytes:,}")
    print(f"Output bytes: {result.output_nbytes:,}")

    statistics = result.statistics
    print(f"Mean: {statistics['mean']:.6f}")
    print(f"Minimum: {statistics['minimum']:.6f}")
    print(f"Maximum: {statistics['maximum']:.6f}")

    return 0


if __name__ == "__main__":
    raise SystemExit(main())
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical-data-processor"
version = "0.1.0"
description = "Production-oriented numerical data processing pipeline built with NumPy."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.setuptools]
package-dir = {"" = "../src"}

[tool.setuptools.packages.find]
where = ["../src"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["../src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["../src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["../src", "../tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

