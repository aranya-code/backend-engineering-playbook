name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable image tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: |
          echo "Deploying image: ${{ inputs.image }}"
          echo "Real infrastructure commands belong here."
