name: Project Check
description: Install dependencies and execute pytest
inputs:
  python-version:
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - shell: bash
      run: pip install -r requirements.txt
    - shell: bash
      run: pytest -q
