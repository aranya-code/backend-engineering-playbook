name: Capstone CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: capstone-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/project-check
        with:
          python-version: ${{ matrix.python-version }}

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: capstone
          POSTGRES_USER: capstone
          POSTGRES_PASSWORD: capstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U capstone -d capstone"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import os, psycopg, redis
          conn = psycopg.connect(
              dbname="capstone",
              user="capstone",
              password="capstone",
              host="localhost",
              port=5432,
          )
          with conn.cursor() as cur:
              cur.execute("SELECT 1")
              assert cur.fetchone()[0] == 1
          conn.close()
          r = redis.Redis(host="localhost", port=6379)
          r.set("ci", "ok")
          assert r.get("ci") == b"ok"
          print("PostgreSQL and Redis checks passed")
          PY

  docker:
    needs: [matrix, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/github-actions-capstone:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
