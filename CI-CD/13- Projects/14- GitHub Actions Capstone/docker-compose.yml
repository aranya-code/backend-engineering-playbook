services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone

  redis:
    image: redis:7
