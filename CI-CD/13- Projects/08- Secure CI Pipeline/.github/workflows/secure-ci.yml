name: Secure CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Verify no obvious private-key material was committed
        shell: bash
        run: |
          if grep -R -nE --exclude-dir=.git --exclude-dir=.github              'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' .; then
            echo "Potential private key detected."
            exit 1
          fi
