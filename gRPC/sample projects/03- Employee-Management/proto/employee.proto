syntax="proto3";
package employee;
service EmployeeService{
 rpc CreateEmployee(Employee) returns (EmployeeResponse);
 rpc GetEmployee(EmployeeId) returns (Employee);
 rpc ListEmployees(Empty) returns (EmployeeList);
}
message Empty{}
message EmployeeId{int32 id=1;}
message Employee{int32 id=1; string name=2; string email=3; string department=4;}
message EmployeeResponse{string message=1;}
message EmployeeList{repeated Employee employees=1;}
