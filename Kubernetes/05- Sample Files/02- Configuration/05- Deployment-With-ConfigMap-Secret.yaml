# ==========================================================
# Kubernetes Deployment with ConfigMap & Secret Example
# ==========================================================
#
# Description:
# Deploys an application that consumes configuration from
# both a ConfigMap and a Secret.
#
# Purpose:
# - Learn how ConfigMaps and Secrets work together
# - Separate normal configuration from sensitive data
# - Build production-ready Kubernetes Deployments
# - Demonstrate a common real-world deployment pattern
#
# Prerequisites:
# - Kubernetes cluster
# - kubectl configured
# - ConfigMap created
# - Secret created
#
# Create ConfigMap:
# kubectl apply -f 01-ConfigMap.yaml
#
# Create Secret:
# kubectl apply -f 02-Secret.yaml
#
# Deploy:
# kubectl apply -f 05-Deployment-With-Both.yaml
#
# Verify:
# kubectl get deployments
# kubectl get pods
#
# Delete:
# kubectl delete -f 05-Deployment-With-Both.yaml
#
# Notes:
# - ConfigMaps store NON-SENSITIVE configuration.
# - Secrets store SENSITIVE configuration.
# - This is the recommended pattern for production
#   applications.
#
# ==========================================================

# Kubernetes Deployment API version.
apiVersion: apps/v1

# Resource type.
kind: Deployment

# ----------------------------------------------------------
# Metadata
# ----------------------------------------------------------
metadata:

  # Deployment name.
  name: backend-api

  labels:

    app: backend-api

    environment: development

# ----------------------------------------------------------
# Deployment Specification
# ----------------------------------------------------------
spec:

  # Number of application replicas.
  replicas: 3

  # Deployment selector.
  selector:

    matchLabels:

      app: backend-api

  # --------------------------------------------------------
  # Pod Template
  # --------------------------------------------------------
  template:

    metadata:

      labels:

        app: backend-api

        tier: backend

    spec:

      containers:

        - name: backend-api

          # Example container image.
          image: nginx:latest

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 80

              name: http

          # --------------------------------------------------
          # ConfigMap
          # --------------------------------------------------
          #
          # Import ALL configuration values from ConfigMap.
          #
          envFrom:

            - configMapRef:

                name: backend-config

          # --------------------------------------------------
          # Secrets
          # --------------------------------------------------
          #
          # Import only sensitive values individually.
          #
          env:

            - name: DB_USERNAME

              valueFrom:

                secretKeyRef:

                  name: backend-secret

                  key: DB_USERNAME

            - name: DB_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: backend-secret

                  key: DB_PASSWORD

            - name: REDIS_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: backend-secret

                  key: REDIS_PASSWORD

            - name: DJANGO_SECRET_KEY

              valueFrom:

                secretKeyRef:

                  name: backend-secret

                  key: DJANGO_SECRET_KEY

            - name: JWT_SECRET

              valueFrom:

                secretKeyRef:

                  name: backend-secret

                  key: JWT_SECRET

          # --------------------------------------------------
          # Resource Requests & Limits
          # --------------------------------------------------
          resources:

            requests:

              cpu: "100m"

              memory: "128Mi"

            limits:

              cpu: "250m"

              memory: "256Mi"

          # --------------------------------------------------
          # Readiness Probe
          # --------------------------------------------------
          readinessProbe:

            httpGet:

              path: /

              port: 80

            initialDelaySeconds: 5

            periodSeconds: 5

            timeoutSeconds: 3

          # --------------------------------------------------
          # Liveness Probe
          # --------------------------------------------------
          livenessProbe:

            httpGet:

              path: /

              port: 80

            initialDelaySeconds: 15

            periodSeconds: 10

            timeoutSeconds: 5

      restartPolicy: Always

      terminationGracePeriodSeconds: 30

# ==========================================================
# Architecture
# ==========================================================
#
#                ConfigMap
#                    │
#                    │
#                    ▼
#          Non-Sensitive Settings
#                    │
#                    │
#                    ▼
#               Deployment
#                    ▲
#                    │
#                    │
#             Sensitive Values
#                    ▲
#                    │
#                 Secret
#                    │
#                    ▼
#               Environment
#                Variables
#                    │
#                    ▼
#                  Pods
#
# ==========================================================
#
# Configuration Sources
#
# ConfigMap
#
# ✓ APP_NAME
# ✓ APP_ENV
# ✓ APP_DEBUG
# ✓ DB_HOST
# ✓ DB_PORT
# ✓ REDIS_HOST
# ✓ REDIS_PORT
# ✓ LOG_LEVEL
#
#
# Secret
#
# ✓ DB_USERNAME
# ✓ DB_PASSWORD
# ✓ REDIS_PASSWORD
# ✓ DJANGO_SECRET_KEY
# ✓ JWT_SECRET
#
# ==========================================================
#
# Request Flow
#
# ConfigMap
#       │
#       ▼
# Deployment
#       ▲
#       │
# Secret
#       │
#       ▼
# ReplicaSet
#       │
#       ▼
# Pods
#       │
#       ▼
# Application Starts
#
# ==========================================================
#
# Useful Commands
#
# View ConfigMaps
# kubectl get configmaps
#
# View Secrets
# kubectl get secrets
#
# View Deployments
# kubectl get deployments
#
# View Pods
# kubectl get pods
#
# View Environment Variables
# kubectl exec -it <pod-name> -- env
#
# Restart Deployment After Configuration Change
# kubectl rollout restart deployment backend-api
#
# Check Rollout Status
# kubectl rollout status deployment backend-api
#
# ==========================================================
#
# Common Mistakes
#
# ❌ Storing passwords inside ConfigMaps.
#
# ❌ Putting non-sensitive values inside Secrets.
#
# ❌ ConfigMap or Secret does not exist before Deployment.
#
# ❌ Assuming Pods automatically reload configuration.
#
# ❌ Hardcoding credentials inside application code.
#
# ❌ Forgetting to restart Pods after configuration changes.
#
# ==========================================================
#
# Best Practices
#
# ✓ Store configuration in ConfigMaps.
#
# ✓ Store credentials in Secrets.
#
# ✓ Keep applications stateless.
#
# ✓ Version configuration with deployments.
#
# ✓ Rotate Secrets regularly.
#
# ✓ Use external Secret Managers in production.
#
# ✓ Restart Deployments after ConfigMap or Secret updates if
#   the application loads configuration only during startup.
#
# ==========================================================
#
# Production Pattern
#
# ConfigMap
#      │
#      ├── Application Settings
#      ├── Logging
#      ├── Feature Flags
#      └── Hostnames
#
# Secret
#      │
#      ├── Database Password
#      ├── API Keys
#      ├── JWT Secret
#      ├── OAuth Tokens
#      └── Certificates
#
# ==========================================================
#
# Interview Tips
#
# ✓ Almost every production Deployment uses both ConfigMaps
#   and Secrets.
#
# ✓ ConfigMaps separate application configuration from code.
#
# ✓ Secrets protect confidential information.
#
# ✓ ConfigMaps and Secrets can be consumed as environment
#   variables or mounted as files.
#
# ✓ Separating configuration from credentials makes
#   applications easier to deploy across development,
#   staging, and production environments.
#
# ==========================================================