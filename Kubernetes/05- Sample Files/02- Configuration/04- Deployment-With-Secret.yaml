# ==========================================================
# Kubernetes Deployment with Secret Example
# ==========================================================
#
# Description:
# Deploys an application that consumes sensitive
# configuration from a Kubernetes Secret.
#
# Purpose:
# - Learn how Deployments use Secrets
# - Inject sensitive configuration securely
# - Understand secretKeyRef
# - Keep credentials out of application code
#
# Prerequisites:
# - Kubernetes cluster
# - kubectl configured
# - Secret created
#
# Create Secret:
# kubectl apply -f 02-Secret.yaml
#
# Deploy:
# kubectl apply -f 04-Deployment-With-Secret.yaml
#
# Verify:
# kubectl get deployments
# kubectl get pods
#
# Delete:
# kubectl delete -f 04-Deployment-With-Secret.yaml
#
# Notes:
# - The Secret MUST exist before deploying.
# - Never hardcode passwords inside YAML manifests.
# - Kubernetes injects Secret values as environment
#   variables.
#
# ==========================================================

# Deployment API version.
apiVersion: apps/v1

# Kubernetes resource type.
kind: Deployment

# ----------------------------------------------------------
# Metadata
# ----------------------------------------------------------
metadata:

  # Deployment name.
  name: backend-api

  labels:

    app: backend-api

    environment: development

# ----------------------------------------------------------
# Deployment Specification
# ----------------------------------------------------------
spec:

  # Desired number of Pods.
  replicas: 3

  # Deployment selector.
  selector:

    matchLabels:

      app: backend-api

  # --------------------------------------------------------
  # Pod Template
  # --------------------------------------------------------
  template:

    metadata:

      labels:

        app: backend-api

        tier: backend

    spec:

      containers:

        - name: backend-api

          # Example application image.
          image: nginx:latest

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 80

          # --------------------------------------------------
          # Secret Environment Variables
          # --------------------------------------------------
          #
          # Each environment variable references a specific
          # key inside the Secret.
          #
          env:

            # Database Username
            - name: DB_USERNAME

              valueFrom:

                secretKeyRef:

                  name: backend-secret

                  key: DB_USERNAME

            # Database Password
            - name: DB_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: backend-secret

                  key: DB_PASSWORD

            # Redis Password
            - name: REDIS_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: backend-secret

                  key: REDIS_PASSWORD

            # Django Secret Key
            - name: DJANGO_SECRET_KEY

              valueFrom:

                secretKeyRef:

                  name: backend-secret

                  key: DJANGO_SECRET_KEY

            # JWT Secret
            - name: JWT_SECRET

              valueFrom:

                secretKeyRef:

                  name: backend-secret

                  key: JWT_SECRET

          # --------------------------------------------------
          # Resource Requests & Limits
          # --------------------------------------------------
          resources:

            requests:

              cpu: "100m"

              memory: "128Mi"

            limits:

              cpu: "250m"

              memory: "256Mi"

          # --------------------------------------------------
          # Readiness Probe
          # --------------------------------------------------
          readinessProbe:

            httpGet:

              path: /

              port: 80

            initialDelaySeconds: 5

            periodSeconds: 5

          # --------------------------------------------------
          # Liveness Probe
          # --------------------------------------------------
          livenessProbe:

            httpGet:

              path: /

              port: 80

            initialDelaySeconds: 15

            periodSeconds: 10

      restartPolicy: Always

# ==========================================================
# Architecture
# ==========================================================
#
#              Secret
#                 │
#                 ▼
#         backend-secret
#                 │
#                 ▼
#      secretKeyRef
#                 │
#                 ▼
#        Environment Variables
#                 │
#                 ▼
#           Deployment
#                 │
#                 ▼
#            ReplicaSet
#                 │
#                 ▼
#               Pods
#
# ==========================================================
#
# Secret Values Injected
#
# DB_USERNAME
#
# DB_PASSWORD
#
# REDIS_PASSWORD
#
# DJANGO_SECRET_KEY
#
# JWT_SECRET
#
# ==========================================================
#
# Alternative Approach
#
# Import ALL Secret values:
#
# envFrom:
#
# - secretRef:
#
#     name: backend-secret
#
# This imports every key inside the Secret.
#
# ==========================================================
#
# Useful Commands
#
# View Secrets
# kubectl get secrets
#
# Describe Secret
# kubectl describe secret backend-secret
#
# View Deployment
# kubectl get deployment
#
# View Pods
# kubectl get pods
#
# View Environment Variables
# kubectl exec -it <pod-name> -- env
#
# Verify Secret Exists
# kubectl get secret backend-secret
#
# ==========================================================
#
# Common Mistakes
#
# ❌ Secret does not exist.
#
# ❌ Incorrect Secret name.
#
# ❌ Incorrect key name.
#
# ❌ Storing credentials in ConfigMaps.
#
# ❌ Hardcoding passwords inside YAML files.
#
# ❌ Printing Secret values in application logs.
#
# ==========================================================
#
# Best Practices
#
# ✓ Store only sensitive data inside Secrets.
#
# ✓ Grant Secret access only to required Pods.
#
# ✓ Rotate credentials regularly.
#
# ✓ Enable Encryption at Rest.
#
# ✓ Integrate with external Secret Managers for production.
#
# ✓ Never commit production Secret values to Git.
#
# ==========================================================
#
# Interview Tips
#
# ✓ Secrets provide sensitive configuration to applications.
#
# ✓ secretKeyRef imports a single Secret value.
#
# ✓ envFrom imports the entire Secret.
#
# ✓ Secret values are Base64 encoded by default.
#
# ✓ Base64 encoding is not encryption.
#
# ✓ Production clusters often integrate with AWS Secrets
#   Manager, Azure Key Vault, or HashiCorp Vault.
#
# ==========================================================