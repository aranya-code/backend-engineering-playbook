# ==========================================================
# Kubernetes ConfigMap Example
# ==========================================================
#
# Description:
# Creates a ConfigMap that stores application configuration
# separately from the container image.
#
# Purpose:
# - Learn how ConfigMaps work
# - Store non-sensitive configuration
# - Decouple configuration from application code
# - Make applications portable across environments
#
# Prerequisites:
# - Kubernetes cluster
# - kubectl configured
#
# Deploy:
# kubectl apply -f 01-ConfigMap.yaml
#
# Verify:
# kubectl get configmaps
# kubectl describe configmap backend-config
#
# Delete:
# kubectl delete -f 01-ConfigMap.yaml
#
# Notes:
# - ConfigMaps store NON-SENSITIVE data.
# - Do NOT store passwords, API keys, or tokens here.
# - Use Secrets for confidential information.
# - ConfigMaps can be consumed as:
#     • Environment Variables
#     • Command-line Arguments
#     • Mounted Files
#
# ==========================================================

# API version for ConfigMap resources.
apiVersion: v1

# Kubernetes resource type.
kind: ConfigMap

# ----------------------------------------------------------
# Metadata
# ----------------------------------------------------------
metadata:

  # Name of the ConfigMap.
  name: backend-config

  # Labels for organization.
  labels:

    app: backend-api

    environment: development

# ----------------------------------------------------------
# Configuration Data
# ----------------------------------------------------------
#
# Each key becomes:
#
# • an environment variable
# OR
# • a mounted configuration file
#
data:

  # --------------------------------------------------------
  # Application Configuration
  # --------------------------------------------------------

  APP_NAME: "Backend Engineering Playbook"

  APP_ENV: "development"

  APP_DEBUG: "true"

  APP_VERSION: "1.0.0"

  # --------------------------------------------------------
  # Server Configuration
  # --------------------------------------------------------

  HOST: "0.0.0.0"

  PORT: "8000"

  LOG_LEVEL: "INFO"

  # --------------------------------------------------------
  # Database Configuration
  #
  # These are NOT sensitive.
  # Passwords belong in Secrets.
  # --------------------------------------------------------

  DB_HOST: "postgres-service"

  DB_PORT: "5432"

  DB_NAME: "backend_db"

  # --------------------------------------------------------
  # Redis Configuration
  # --------------------------------------------------------

  REDIS_HOST: "redis-service"

  REDIS_PORT: "6379"

  CACHE_TIMEOUT: "300"

  # --------------------------------------------------------
  # Feature Flags
  # --------------------------------------------------------

  ENABLE_CACHE: "true"

  ENABLE_RATE_LIMITING: "false"

  ENABLE_SWAGGER: "true"

# ==========================================================
# Architecture
# ==========================================================
#
#             ConfigMap
#                 │
#                 ▼
#      Stores Configuration
#                 │
#      ┌──────────┴──────────┐
#      ▼                     ▼
# Environment          Mounted File
# Variables
#      │                     │
#      └──────────┬──────────┘
#                 ▼
#          Application
#
# ==========================================================
#
# Example Usage (Environment Variables)
#
# envFrom:
#
# - configMapRef:
#
#     name: backend-config
#
# ==========================================================
#
# Example Usage (Single Environment Variable)
#
# env:
#
# - name: APP_ENV
#
#   valueFrom:
#
#     configMapKeyRef:
#
#       name: backend-config
#
#       key: APP_ENV
#
# ==========================================================
#
# Example Usage (Volume Mount)
#
# volumes:
#
# - name: config-volume
#
#   configMap:
#
#     name: backend-config
#
#
# volumeMounts:
#
# - name: config-volume
#
#   mountPath: /app/config
#
# ==========================================================
#
# Useful Commands
#
# List ConfigMaps
# kubectl get configmaps
#
# Short Form
# kubectl get cm
#
# Describe ConfigMap
# kubectl describe configmap backend-config
#
# View YAML
# kubectl get configmap backend-config -o yaml
#
# Edit ConfigMap
# kubectl edit configmap backend-config
#
# Delete ConfigMap
# kubectl delete configmap backend-config
#
# ==========================================================
#
# Expected Output
#
# NAME
# backend-config
#
# DATA
# 12
#
# AGE
# 15s
#
# ==========================================================
#
# Common Mistakes
#
# ❌ Storing passwords inside ConfigMaps.
#
# ❌ Forgetting to restart Pods after updating ConfigMaps.
#
# ❌ Mixing configuration with container images.
#
# ❌ Using ConfigMaps for binary data.
#
# ❌ Hardcoding environment-specific values inside code.
#
# ==========================================================
#
# Best Practices
#
# ✓ Store only non-sensitive configuration.
#
# ✓ Use Secrets for credentials.
#
# ✓ Keep ConfigMaps environment-specific.
#
# ✓ Version configuration with your deployment manifests.
#
# ✓ Give ConfigMaps descriptive names.
#
# ✓ Separate application configuration from infrastructure.
#
# ==========================================================
#
# Interview Tips
#
# ✓ ConfigMaps store non-sensitive configuration data.
#
# ✓ They decouple configuration from application code.
#
# ✓ ConfigMaps can be injected into Pods as:
#     • Environment Variables
#     • Individual Keys
#     • Mounted Files
#
# ✓ Updating a ConfigMap does not automatically restart Pods.
#   A rollout restart is often required for applications that
#   read configuration only during startup.
#
# ==========================================================