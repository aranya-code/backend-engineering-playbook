# ==========================================================
# Kubernetes Secret Example
# ==========================================================
#
# Description:
# Creates a Secret that stores sensitive application data
# such as passwords, API keys, access tokens, and database
# credentials.
#
# Purpose:
# - Learn how Kubernetes Secrets work
# - Store sensitive configuration securely
# - Separate credentials from application code
# - Inject secrets into Pods
#
# Prerequisites:
# - Kubernetes cluster
# - kubectl configured
#
# Deploy:
# kubectl apply -f 02-Secret.yaml
#
# Verify:
# kubectl get secrets
# kubectl describe secret backend-secret
#
# Delete:
# kubectl delete -f 02-Secret.yaml
#
# Notes:
# - Secrets are intended for sensitive data.
# - Values are Base64 encoded, NOT encrypted.
# - Enable Encryption at Rest in production.
# - Never commit production Secrets to Git.
# - Prefer external secret managers in production
#   (AWS Secrets Manager, Azure Key Vault,
#   HashiCorp Vault, etc.).
#
# ==========================================================

# API version.
apiVersion: v1

# Kubernetes resource type.
kind: Secret

# ----------------------------------------------------------
# Secret Metadata
# ----------------------------------------------------------
metadata:

  # Secret name.
  name: backend-secret

  # Labels help organize resources.
  labels:

    app: backend-api

    environment: development

# ----------------------------------------------------------
# Secret Type
# ----------------------------------------------------------
#
# Common Secret Types:
#
# Opaque
# kubernetes.io/dockerconfigjson
# kubernetes.io/tls
# kubernetes.io/service-account-token
#
type: Opaque

# ----------------------------------------------------------
# Secret Data
# ----------------------------------------------------------
#
# Values inside "stringData" are plain text.
#
# Kubernetes automatically converts them into Base64
# and stores them under the "data" field.
#
# This is easier than manually Base64 encoding values.
#
stringData:

  # --------------------------------------------------------
  # Database Credentials
  # --------------------------------------------------------

  DB_USERNAME: postgres

  DB_PASSWORD: SuperSecretPassword123

  # --------------------------------------------------------
  # Redis Password
  # --------------------------------------------------------

  REDIS_PASSWORD: RedisSecret456

  # --------------------------------------------------------
  # Django Secret Key
  # --------------------------------------------------------

  DJANGO_SECRET_KEY: django-secret-key-example

  # --------------------------------------------------------
  # API Credentials
  # --------------------------------------------------------

  API_KEY: example-api-key

  JWT_SECRET: jwt-secret-example

# ==========================================================
# Architecture
# ==========================================================
#
#              Secret
#                 │
#                 ▼
#        Stores Sensitive Data
#                 │
#      ┌──────────┴──────────┐
#      ▼                     ▼
# Environment          Mounted File
# Variables
#      │                     │
#      └──────────┬──────────┘
#                 ▼
#            Application
#
# ==========================================================
#
# Example Usage (All Environment Variables)
#
# envFrom:
#
# - secretRef:
#
#     name: backend-secret
#
# ==========================================================
#
# Example Usage (Single Secret)
#
# env:
#
# - name: DB_PASSWORD
#
#   valueFrom:
#
#     secretKeyRef:
#
#       name: backend-secret
#
#       key: DB_PASSWORD
#
# ==========================================================
#
# Example Usage (Volume Mount)
#
# volumes:
#
# - name: secret-volume
#
#   secret:
#
#     secretName: backend-secret
#
#
# volumeMounts:
#
# - name: secret-volume
#
#   mountPath: /app/secrets
#
#   readOnly: true
#
# ==========================================================
#
# Verify the Secret
#
# List Secrets
#
# kubectl get secrets
#
# Describe Secret
#
# kubectl describe secret backend-secret
#
# View YAML
#
# kubectl get secret backend-secret -o yaml
#
# Decode a Secret Value
#
# kubectl get secret backend-secret \
# -o jsonpath="{.data.DB_PASSWORD}" | base64 --decode
#
# ==========================================================
#
# Expected Output
#
# NAME
# backend-secret
#
# TYPE
# Opaque
#
# DATA
# 5
#
# ==========================================================
#
# ConfigMap vs Secret
#
# ConfigMap
#
# ✓ Non-sensitive configuration
#
# Examples:
# • Hostnames
# • Ports
# • Feature Flags
# • Log Levels
#
#
# Secret
#
# ✓ Sensitive configuration
#
# Examples:
# • Passwords
# • API Keys
# • OAuth Tokens
# • Certificates
# • Secret Keys
#
# ==========================================================
#
# Common Mistakes
#
# ❌ Storing passwords in ConfigMaps.
#
# ❌ Assuming Base64 is encryption.
#
# ❌ Committing Secrets to Git.
#
# ❌ Printing Secrets in application logs.
#
# ❌ Giving Pods unnecessary access to Secrets.
#
# ❌ Hardcoding credentials inside container images.
#
# ==========================================================
#
# Best Practices
#
# ✓ Store only sensitive values in Secrets.
#
# ✓ Use ConfigMaps for normal configuration.
#
# ✓ Enable Kubernetes Encryption at Rest.
#
# ✓ Rotate credentials regularly.
#
# ✓ Limit Secret access using RBAC.
#
# ✓ Use external Secret Managers in production.
#
# ✓ Mount Secrets as read-only volumes when possible.
#
# ==========================================================
#
# Interview Tips
#
# ✓ Secrets store confidential application data.
#
# ✓ Secret values are Base64 encoded by default.
#
# ✓ Base64 encoding is NOT encryption.
#
# ✓ Secrets can be consumed as:
#     • Environment Variables
#     • Individual Keys
#     • Mounted Files
#
# ✓ Production Kubernetes clusters commonly integrate
#   with external Secret Managers instead of storing
#   credentials directly in Kubernetes.
#
# ==========================================================