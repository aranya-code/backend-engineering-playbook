server {
    # Listen on port 80 (HTTP)
    listen 80;
    server_name localhost;

    location / {
        # Forward all requests to the "api" service on port 8000
        # "api" resolves to the backend service defined in Docker Compose
        proxy_pass http://api:8000;
        
        # Use HTTP/1.1 for keep-alive connections
        proxy_http_version 1.1;
        
        # Preserve original request headers so the backend knows the actual client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Add a custom header to responses to show Nginx processed the request
        add_header X-Proxy-Server "nginx";
    }
}
