# Nginx virtual host configuration
server{
    # Listen on standard HTTP port 80
    listen 80;
    
    # Forward all root requests to the internal API container on port 8000
    location / {
        proxy_pass http://api:8000;
    }
    
    # Explicitly forward health check requests
    location /health {
        proxy_pass http://api:8000/health;
    }
}
