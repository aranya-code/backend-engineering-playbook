# Main Nginx configuration file
# Run as the unprivileged 'nginx' user
user nginx;
# Automatically determine the optimal number of worker processes based on CPU cores
worker_processes auto;

events{
    # Maximum number of simultaneous connections per worker process
    worker_connections 1024;
}

http{
    # Include standard MIME types
    include /etc/nginx/mime.types; 
    # Enable gzip compression to reduce payload sizes and improve performance
    gzip on; 
    # Include virtual host configurations from the conf.d directory
    include /etc/nginx/conf.d/*.conf;
}
