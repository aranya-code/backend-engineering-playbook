services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/secure_upload.db}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?Set S3_BUCKET_NAME in .env}
      S3_BUCKET_REGION: ${S3_BUCKET_REGION:-ap-south-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_UPLOAD_PREFIX: ${S3_UPLOAD_PREFIX:-uploads/}
      S3_MAX_UPLOAD_SIZE_BYTES: ${S3_MAX_UPLOAD_SIZE_BYTES:-10485760}
      S3_ALLOWED_CONTENT_TYPES: ${S3_ALLOWED_CONTENT_TYPES:-application/pdf,image/jpeg,image/png}
      S3_PRESIGNED_URL_EXPIRATION_SECONDS: ${S3_PRESIGNED_URL_EXPIRATION_SECONDS:-300}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JSON_LOGGING: ${JSON_LOGGING:-false}
      USE_LOCALSTACK: ${USE_LOCALSTACK:-false}
      LOCALSTACK_ENDPOINT_URL: ${LOCALSTACK_ENDPOINT_URL:-http://localstack:4566}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
    networks:
      - secure-upload-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  localstack:
    image: localstack/localstack:4.14
    profiles:
      - local
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DEBUG: ${LOCALSTACK_DEBUG:-0}
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    networks:
      - secure-upload-network
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"s3\": \"available\"'"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  app_data:
  localstack_data:

networks:
  secure-upload-network:
    driver: bridge