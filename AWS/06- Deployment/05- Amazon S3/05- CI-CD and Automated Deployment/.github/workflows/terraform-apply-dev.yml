name: Apply Terraform - Development

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type deploy-dev to confirm the development deployment."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  apply:
    name: Deploy Development Infrastructure
    runs-on: ubuntu-latest
    environment: development

    defaults:
      run:
        shell: bash

    steps:
      - name: Validate deployment confirmation
        env:
          CONFIRMATION: ${{ inputs.confirm_deployment }}
        run: |
          if [ "$CONFIRMATION" != "deploy-dev" ]; then
            echo "::error::Deployment confirmation failed. Enter deploy-dev to proceed."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_WORKING_DIRECTORY: ${{ vars.TF_DEV_WORKING_DIRECTORY }}
        run: |
          if [ -z "$AWS_ROLE_TO_ASSUME" ]; then
            echo "::error::Repository variable AWS_TERRAFORM_APPLY_ROLE_ARN is required."
            exit 1
          fi

          if [ -z "$AWS_REGION" ]; then
            echo "::error::Repository variable AWS_REGION is required."
            exit 1
          fi

          if [ -z "$TF_WORKING_DIRECTORY" ]; then
            echo "::error::Repository variable TF_DEV_WORKING_DIRECTORY is required."
            exit 1
          fi

          if [ ! -d "$TF_WORKING_DIRECTORY" ]; then
            echo "::error::Terraform working directory does not exist: $TF_WORKING_DIRECTORY"
            exit 1
          fi

          if [ ! -f "$TF_WORKING_DIRECTORY/main.tf" ] && \
             ! find "$TF_WORKING_DIRECTORY" -maxdepth 1 -type f -name '*.tf' -print -quit | grep -q .; then
            echo "::error::No Terraform configuration files found in $TF_WORKING_DIRECTORY"
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsTerraformApplyDev

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Initialize Terraform
        working-directory: ${{ vars.TF_DEV_WORKING_DIRECTORY }}
        run: |
          terraform init \
            -input=false \
            -no-color \
            -lockfile=readonly

      - name: Validate Terraform configuration
        working-directory: ${{ vars.TF_DEV_WORKING_DIRECTORY }}
        run: |
          terraform fmt -check -recursive -diff
          terraform validate -no-color

      - name: Generate Terraform plan
        working-directory: ${{ vars.TF_DEV_WORKING_DIRECTORY }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -lock=true \
            -lock-timeout=5m \
            -out=tfplan

      - name: Apply Terraform plan
        working-directory: ${{ vars.TF_DEV_WORKING_DIRECTORY }}
        run: |
          terraform apply \
            -input=false \
            -no-color \
            -lock=true \
            -lock-timeout=5m \
            tfplan

      - name: Display Terraform outputs
        working-directory: ${{ vars.TF_DEV_WORKING_DIRECTORY }}
        run: |
          terraform output -no-color

      - name: Upload Terraform plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan-${{ github.run_id }}
          path: ${{ vars.TF_DEV_WORKING_DIRECTORY }}/tfplan
          if-no-files-found: ignore
          retention-days: 3