name: Apply Terraform - Production

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type deploy-production to confirm the production deployment."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-apply-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Generate Production Terraform Plan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Validate deployment confirmation
        env:
          CONFIRMATION: ${{ inputs.confirm_deployment }}
        run: |
          if [ "$CONFIRMATION" != "deploy-production" ]; then
            echo "::error::Deployment confirmation failed."
            exit 1
          fi

      - name: Validate deployment branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deployments are allowed only from the main branch."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production configuration
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_TERRAFORM_PROD_PLAN_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_WORKING_DIRECTORY: ${{ vars.TF_PROD_WORKING_DIRECTORY }}
        run: |
          if [ -z "$AWS_ROLE_TO_ASSUME" ]; then
            echo "::error::Repository variable AWS_TERRAFORM_PROD_PLAN_ROLE_ARN is required."
            exit 1
          fi

          if [ -z "$AWS_REGION" ]; then
            echo "::error::Repository variable AWS_REGION is required."
            exit 1
          fi

          if [ -z "$TF_WORKING_DIRECTORY" ]; then
            echo "::error::Repository variable TF_PROD_WORKING_DIRECTORY is required."
            exit 1
          fi

          if [ ! -d "$TF_WORKING_DIRECTORY" ]; then
            echo "::error::Terraform working directory does not exist: $TF_WORKING_DIRECTORY"
            exit 1
          fi

          if ! find "$TF_WORKING_DIRECTORY" \
            -maxdepth 1 \
            -type f \
            -name '*.tf' \
            -print -quit | grep -q .; then
            echo "::error::No Terraform configuration files found."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Configure AWS credentials for planning
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PROD_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsTerraformProdPlan

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Initialize Terraform
        working-directory: ${{ vars.TF_PROD_WORKING_DIRECTORY }}
        run: |
          terraform init \
            -input=false \
            -no-color \
            -lockfile=readonly

      - name: Validate Terraform configuration
        working-directory: ${{ vars.TF_PROD_WORKING_DIRECTORY }}
        run: |
          terraform fmt -check -recursive -diff
          terraform validate -no-color

      - name: Generate production execution plan
        working-directory: ${{ vars.TF_PROD_WORKING_DIRECTORY }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -lock=true \
            -lock-timeout=5m \
            -out=tfplan

      - name: Upload production execution plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-production-plan-${{ github.run_id }}
          path: ${{ vars.TF_PROD_WORKING_DIRECTORY }}/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply Approved Production Plan
    runs-on: ubuntu-latest
    needs: plan

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Validate deployment branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deployments are allowed only from the main branch."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production configuration
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_TERRAFORM_PROD_APPLY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_WORKING_DIRECTORY: ${{ vars.TF_PROD_WORKING_DIRECTORY }}
        run: |
          if [ -z "$AWS_ROLE_TO_ASSUME" ]; then
            echo "::error::Repository variable AWS_TERRAFORM_PROD_APPLY_ROLE_ARN is required."
            exit 1
          fi

          if [ -z "$AWS_REGION" ]; then
            echo "::error::Repository variable AWS_REGION is required."
            exit 1
          fi

          if [ -z "$TF_WORKING_DIRECTORY" ]; then
            echo "::error::Repository variable TF_PROD_WORKING_DIRECTORY is required."
            exit 1
          fi

          if [ ! -d "$TF_WORKING_DIRECTORY" ]; then
            echo "::error::Terraform working directory does not exist: $TF_WORKING_DIRECTORY"
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Download production execution plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-production-plan-${{ github.run_id }}
          path: ${{ vars.TF_PROD_WORKING_DIRECTORY }}

      - name: Verify downloaded plan
        working-directory: ${{ vars.TF_PROD_WORKING_DIRECTORY }}
        run: |
          if [ ! -s tfplan ]; then
            echo "::error::Production Terraform plan is missing or empty."
            exit 1
          fi

      - name: Configure AWS credentials for deployment
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PROD_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsTerraformProdApply

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Initialize Terraform
        working-directory: ${{ vars.TF_PROD_WORKING_DIRECTORY }}
        run: |
          terraform init \
            -input=false \
            -no-color \
            -lockfile=readonly

      - name: Apply approved production plan
        working-directory: ${{ vars.TF_PROD_WORKING_DIRECTORY }}
        run: |
          terraform apply \
            -input=false \
            -no-color \
            -lock=true \
            -lock-timeout=5m \
            tfplan

      - name: Verify Terraform state
        working-directory: ${{ vars.TF_PROD_WORKING_DIRECTORY }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -detailed-exitcode

      - name: Remove local Terraform plan
        if: always()
        working-directory: ${{ vars.TF_PROD_WORKING_DIRECTORY }}
        run: |
          rm -f tfplan