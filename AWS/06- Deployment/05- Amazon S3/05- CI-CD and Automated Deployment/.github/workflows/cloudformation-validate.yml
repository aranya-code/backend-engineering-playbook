name: Validate CloudFormation Templates

on:
  pull_request:
    paths:
      - "06- Deployment/05- Amazon S3/**/templates/**"
      - ".github/workflows/cloudformation-validate.yml"
  push:
    branches:
      - main
    paths:
      - "06- Deployment/05- Amazon S3/**/templates/**"
      - ".github/workflows/cloudformation-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudformation-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CloudFormation Templates
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cfn-lint

      - name: Identify CloudFormation templates
        id: templates
        run: |
          mapfile -t templates < <(
            find "06- Deployment/05- Amazon S3" \
              -type d \
              \( \
                -name .git \
                -o -name .venv \
                -o -name venv \
                -o -name node_modules \
                -o -name .terraform \
              \) -prune \
              -o \
              -type d -name templates -print \
            | while IFS= read -r template_dir; do
                find "$template_dir" \
                  -maxdepth 1 \
                  -type f \
                  \( \
                    -name '*.yaml' \
                    -o -name '*.yml' \
                    -o -name '*.json' \
                  \) -print
              done \
            | sort -u
          )

          if [ "${#templates[@]}" -eq 0 ]; then
            echo "::error::No CloudFormation templates were found in dedicated templates/ directories."
            exit 1
          fi

          printf '%s\n' "${templates[@]}" > cloudformation-templates.txt

          echo "Discovered ${#templates[@]} CloudFormation template(s):"
          printf '%s\n' "${templates[@]}"

      - name: Validate CloudFormation templates with cfn-lint
        run: |
          while IFS= read -r template; do
            [ -n "$template" ] || continue

            echo "::group::Validating ${template}"
            cfn-lint "$template"
            echo "::endgroup::"
          done < cloudformation-templates.txt

      - name: Validate JSON template syntax
        run: |
          while IFS= read -r template; do
            [ -n "$template" ] || continue

            extension="${template##*.}"

            if [ "$extension" = "json" ]; then
              echo "::group::Checking JSON syntax: ${template}"
              python -m json.tool "$template" > /dev/null
              echo "::endgroup::"
            fi
          done < cloudformation-templates.txt

      - name: Upload CloudFormation validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudformation-validation-report
          path: cloudformation-templates.txt
          if-no-files-found: ignore
          retention-days: 7