[build-system]
requires = [
    "setuptools>=75",
    "wheel>=0.45",
]
build-backend = "setuptools.build_meta"

[project]
name = "api-data-processing-pipeline"
version = "1.0.0"
description = "Production-oriented API ingestion and Pandas data processing pipeline."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Backend Engineering Playbook" },
]
dependencies = [
    "pandas>=2.2,<3.0",
    "pyarrow>=16,<22",
    "requests>=2.32,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.13,<2.0",
]

[project.scripts]
run-pipeline = "src.pipeline:main"

[tool.setuptools]
package-dir = { "" = ".." }

[tool.setuptools.packages.find]
where = [".."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".."]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true
source = ["../src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["../src", "../tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "PIE",
    "PT",
    "RUF",
]
ignore = [
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"../tests/*.py" = [
    "B017",
    "PT011",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
files = ["../src"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

